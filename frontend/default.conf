# Cache for public API endpoints (stored in /tmp so any unprivileged pod can write to it)
proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=api_cache:5m max_size=20m inactive=5m use_temp_path=off;
# OpenShift Router sets X-Forwarded-For, so rate-limit by it
limit_req_zone $http_x_forwarded_for zone=api_rl:5m rate=20r/s;

server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /nginx-health { access_log off; return 200 "ok"; }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Public, identical for all users -> cached by nginx
    location ~ ^/api/(catalog|stats)$ {
        proxy_pass http://api:8080;
        proxy_cache api_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache $upstream_cache_status;
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
    }
}
