apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  selector: {app: frontend}
  ports: [{port: 8080, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/part-of: freekube}
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"freekube-frontend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"nginx\")].image"}]'
spec:
  selector: {matchLabels: {app: frontend}}
  template:
    metadata:
      labels: {app: frontend, app.kubernetes.io/part-of: freekube}
    spec:
      containers:
      - name: nginx
        image: image-registry.openshift-image-registry.svc:5000/freekube/freekube-frontend:latest
        imagePullPolicy: Always
        ports: [{containerPort: 8080, name: http}]
        readinessProbe:
          httpGet: {path: /nginx-health, port: 8080}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /nginx-health, port: 8080}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 200m, memory: 96Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: frontend}
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: freekube
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  to: {kind: Service, name: frontend}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
