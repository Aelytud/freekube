# Redis: Sessions, Cache, Job-Queue, Rate Limits. Bewusst ohne Persistenz.
# Faellt Redis aus: User muessen sich neu einloggen, der Maintenance-Job stellt verlorene Jobs wieder her.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  selector: {app: redis}
  ports: [{port: 6379, name: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: redis}}
  template:
    metadata:
      labels: {app: redis, app.kubernetes.io/part-of: freekube}
    spec:
      containers:
      - name: redis
        image: quay.io/sclorg/redis-7-c9s
        ports: [{containerPort: 6379}]
        env:
        - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: freekube-secrets, key: REDIS_PASSWORD}}}
        readinessProbe:
          exec: {command: ["/bin/sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]}
          periodSeconds: 5
        livenessProbe:
          tcpSocket: {port: 6379}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 192Mi}
        volumeMounts:
        - {name: data, mountPath: /var/lib/redis/data}
      volumes:
      - {name: data, emptyDir: {}}
