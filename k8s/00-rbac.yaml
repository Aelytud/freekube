# Only the worker (and maintenance CronJob) are allowed to manage game server resources.
# The API itself has no cluster permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: freekube-orchestrator
  labels: {app.kubernetes.io/part-of: freekube}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: freekube-orchestrator
  labels: {app.kubernetes.io/part-of: freekube}
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: ["route.openshift.io"]
  resources: ["routes"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: freekube-orchestrator
  labels: {app.kubernetes.io/part-of: freekube}
subjects:
- kind: ServiceAccount
  name: freekube-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: freekube-orchestrator
