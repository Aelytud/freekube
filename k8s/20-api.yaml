apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  selector: {app: api}
  ports: [{port: 8080, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/part-of: freekube}
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"freekube-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image"}]'
spec:
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api, app.kubernetes.io/part-of: freekube}
    spec:
      initContainers:
      - name: wait-for-deps
        image: image-registry.openshift-image-registry.svc:5000/freekube/freekube-api:latest
        command: ["python", "-c"]
        args:
        - |
          import socket, time
          for host, port in (("postgres", 5432), ("redis", 6379)):
              while True:
                  try:
                      socket.create_connection((host, port), 2).close()
                      break
                  except OSError:
                      time.sleep(2)
        resources:
          requests: {cpu: 10m, memory: 32Mi}
      containers:
      - name: api
        image: image-registry.openshift-image-registry.svc:5000/freekube/freekube-api:latest
        imagePullPolicy: Always
        ports: [{containerPort: 8080, name: http}]
        env:
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: freekube-secrets, key: DATABASE_URL}}}
        - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: freekube-secrets, key: REDIS_URL}}}
        - {name: MAX_SERVERS_PER_USER, value: "2"}
        - {name: SERVER_TTL_HOURS, value: "24"}
        readinessProbe:
          httpGet: {path: /readyz, port: 8080}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: api}}
