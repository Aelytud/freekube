# Builds direkt aus dem Git-Repo. Repo-URL einmal anpassen (siehe README).
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: freekube-api}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: freekube-gameserver}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata: {name: freekube-frontend}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: freekube-api}
spec:
  source:
    type: Git
    git: {uri: "https://github.com/CHANGE-ME/freekube.git", ref: main}
    contextDir: backend
  strategy: {type: Docker, dockerStrategy: {}}
  output: {to: {kind: ImageStreamTag, name: "freekube-api:latest"}}
  triggers:
  - type: ConfigChange
  - type: GitHub
    github: {secretReference: {name: freekube-webhook}}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: freekube-gameserver}
spec:
  source:
    type: Git
    git: {uri: "https://github.com/CHANGE-ME/freekube.git", ref: main}
    contextDir: gameserver
  strategy: {type: Docker, dockerStrategy: {}}
  output: {to: {kind: ImageStreamTag, name: "freekube-gameserver:latest"}}
  triggers:
  - type: ConfigChange
  - type: GitHub
    github: {secretReference: {name: freekube-webhook}}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata: {name: freekube-frontend}
spec:
  source:
    type: Git
    git: {uri: "https://github.com/CHANGE-ME/freekube.git", ref: main}
    contextDir: frontend
  strategy: {type: Docker, dockerStrategy: {}}
  output: {to: {kind: ImageStreamTag, name: "freekube-frontend:latest"}}
  triggers:
  - type: ConfigChange
  - type: GitHub
    github: {secretReference: {name: freekube-webhook}}
