apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {app.kubernetes.io/part-of: freekube}
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"freekube-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"worker\")].image"}]'
spec:
  selector: {matchLabels: {app: worker}}
  template:
    metadata:
      labels: {app: worker, app.kubernetes.io/part-of: freekube}
    spec:
      serviceAccountName: freekube-orchestrator
      containers:
      - name: worker
        image: image-registry.openshift-image-registry.svc:5000/freekube/freekube-api:latest
        imagePullPolicy: Always
        command: ["python", "worker.py"]
        env:
        - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: freekube-secrets, key: DATABASE_URL}}}
        - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: freekube-secrets, key: REDIS_URL}}}
        - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        - {name: GAMESERVER_IMAGE, value: "image-registry.openshift-image-registry.svc:5000/freekube/freekube-gameserver:latest"}
        livenessProbe:
          exec:
            command: ["python", "-c", "import common; common.rds().ping()"]
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
        resources:
          requests: {cpu: 50m, memory: 96Mi}
          limits: {cpu: 300m, memory: 192Mi}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: worker}
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  labels: {app.kubernetes.io/part-of: freekube}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: worker}}
