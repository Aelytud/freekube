# Braucht den OpenShift GitOps Operator (ArgoCD). Repo-URL anpassen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: freekube
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE-ME/freekube.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: freekube
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
    - RespectIgnoreDifferences=true
  # Image-Trigger schreiben den Image-Digest in die Deployments, das darf ArgoCD nicht zurueckdrehen
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jqPathExpressions:
    - .spec.template.spec.containers[].image
    - .spec.template.spec.initContainers[].image
  - group: batch
    kind: CronJob
    jqPathExpressions:
    - .spec.jobTemplate.spec.template.spec.containers[].image
